name: Helper (macOS)
on:
  workflow_dispatch:
  push:
    paths: ['helper/**', '.github/workflows/helper.yml']
jobs:
  build:
    strategy: { fail-fast: false, matrix: { os: [macos-latest, macos-26] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Newest Xcode on this runner
        run: |
          ls -d /Applications/Xcode*.app
          X="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"; sudo xcode-select -s "$X"; xcodebuild -version; sw_vers
      - run: ./helper/mac/build.sh "$RUNNER_TEMP/helper" 0.0.0
      - run: lipo -info "$RUNNER_TEMP/helper/ColoredLensHelper"
